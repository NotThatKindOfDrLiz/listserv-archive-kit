<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listserv Archive</title>
<style>
/* BRAND COLOURS: change these to match your division's website.
   --navy = main colour, --navy-deep = darker shade, --steel = secondary,
   --sky = light accent, --red = buttons and highlights. */
:root{
  --navy:#1f4e79; --navy-deep:#163a5a; --steel:#5b7a99; --sky:#9cc3e0; --red:#b5462a;
  --bg:#ffffff; --surface:#ffffff; --tint:#f3f6f9; --ink:#4a4d50; --heading:#1f4e79; --muted:#6b7073; --faint:#8f9496;
  --line:#dfe5eb; --brand:#1f4e79; --brand-ink:#ffffff; --mark:#d3eaf4; --chip:#eef5f9;
  --shadow:0 1px 2px rgba(7,65,105,.06),0 6px 18px rgba(7,65,105,.06); --radius:4px;
  --serif:"Lusitana","Sabon","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Gotham","Montserrat","Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0d1b26;--surface:#132634;--tint:#10212d;--ink:#dbe3e8;--heading:#8bc5dc;--muted:#a3b2bd;--faint:#7c8b96;
    --line:#22394a;--brand:#8bc5dc;--brand-ink:#072a40;--mark:#1f4a63;--chip:#183140;--shadow:0 1px 2px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--sans)}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--heading)}
.proto{background:var(--red);color:#fff;text-align:center;font-size:12.5px;letter-spacing:.02em;padding:5px 16px}
/* top utility bar, like the site's navy strip */
.util{background:var(--navy);color:#fff}
.util .in{max-width:1140px;margin:0 auto;padding:9px 24px;display:flex;justify-content:flex-end;align-items:center;gap:14px;font-size:13px}
.util .pill{border:1.5px solid #fff;color:#fff;padding:3px 14px;font-weight:500;letter-spacing:.02em}
.util .pill:hover{background:#fff;color:var(--navy);text-decoration:none}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1140px;margin:0 auto;padding:18px 24px;display:flex;gap:28px;align-items:center}
.logo{display:flex;align-items:center;gap:12px;color:var(--ink)} .logo:hover{text-decoration:none}
.logo .mono{flex:none;width:42px;height:42px;display:grid;place-items:center;background:var(--navy);color:#fff;font-family:var(--serif);font-size:17px;border-radius:3px}
.logo .wm{font-family:var(--serif);font-size:21px;line-height:1.05;color:var(--ink)}
.logo .wm i{display:block;font-size:14px;color:var(--steel);margin-top:3px}
.bar form{flex:1;display:flex;max-width:420px;margin-left:auto}
.bar nav{display:flex;gap:26px;font-size:15px;font-weight:600;white-space:nowrap}
.bar nav a{color:var(--navy);padding-bottom:3px;border-bottom:3px solid transparent} @media (prefers-color-scheme: dark){.bar nav a{color:var(--sky)}}
.bar nav a.on{border-bottom-color:var(--red)} .bar nav a:hover{text-decoration:none;border-bottom-color:var(--sky)}
.secbar{background:var(--steel);color:#fff;font-size:13.5px}
.secbar .in{max-width:1140px;margin:0 auto;padding:8px 24px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.secbar b{letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.secbar a{color:#fff;text-decoration:underline}
.hero.ann{background:linear-gradient(135deg,rgba(93,133,162,.96),rgba(11,85,137,.94) 70%,rgba(7,65,105,.97)),var(--navy)}
.flyers{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.flyers a{display:block;max-width:min(720px,100%)} .flyers img{display:block;max-width:100%;height:auto;border:1px solid var(--line)}
main{max-width:1140px;margin:0 auto;padding:28px 24px 64px}
.search{display:flex;width:100%;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:9px 14px;outline:none;min-width:0}
.search button{border:0;background:var(--steel);color:#fff;font:inherit;font-weight:600;letter-spacing:.03em;padding:0 20px;cursor:pointer}
.search button:hover{background:var(--navy)}
/* hero: full-width navy band echoing the site's banner */
.hero{margin:-28px calc(50% - 50vw) 0;padding:56px 24px 46px;color:#fff;
  background:linear-gradient(135deg,rgba(7,65,105,.97),rgba(11,85,137,.93) 60%,rgba(93,133,162,.92)),var(--navy-deep)}
.hero .in{max-width:1092px;margin:0 auto;text-align:center}
.hero .kicker{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--sky);font-weight:600;margin:0 auto 10px}
.hero h1{font-size:40px;line-height:1.15;margin:0 auto 12px;max-width:860px;color:#fff}
.hero p{color:#dceaf2;margin:0 auto 26px;max-width:680px;font-size:16px}
.hero .search{max-width:720px;margin:0 auto;border:0;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.hero .search input{font-size:17px;padding:15px 20px;background:#fff;color:#4d5052}
.hero .search button{background:var(--red);padding:0 26px} .hero .search button:hover{background:#a12408}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px auto 0;max-width:820px}
.chip{background:transparent;border:1px solid rgba(139,197,220,.7);color:#fff;padding:5px 13px;font:inherit;font-size:13.5px;cursor:pointer}
.chip:hover{background:var(--sky);color:var(--navy-deep);border-color:var(--sky)}
.rule{border:0;border-top:3px dotted var(--sky);margin:34px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:30px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:18px 10px;text-align:center}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:34px;color:var(--heading);line-height:1.1}
.stat span{color:var(--muted);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
h2{font-size:26px;margin:0 0 14px}
h2.sec{text-align:center;font-size:30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow)}
.list .card{margin-bottom:10px;border-left:3px solid var(--sky)}
.list .card:hover{border-left-color:var(--navy)}
.tcard h3{margin:0 0 4px;font-size:19px;line-height:1.3}
.tcard h3 a{color:var(--heading)}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.snip{margin:8px 0 0;font-size:14.5px;color:var(--ink)}
.snip .who{color:var(--steel);font-weight:600}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--sky)}
.years{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 6px 0}
.yr{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--muted);font-size:13px}
.yr .b{width:100%;background:linear-gradient(180deg,var(--steel),var(--navy));border-radius:2px 2px 0 0;min-height:4px}
.yr:hover .b{background:var(--red)} .yr:hover{color:var(--ink)}
.yr .n{font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:4px 0 16px;color:var(--muted);font-size:14px}
.toolbar select{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:5px 8px;font:inherit;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 18px}
.tab{padding:10px 16px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:600;font-size:15px}
.tab.on{color:var(--heading);border-color:var(--red)}
.count{background:var(--chip);padding:1px 8px;font-size:12px;margin-left:6px;color:var(--steel)}
.pagehead{margin:0 calc(50% - 50vw) 24px;margin-top:-28px;padding:26px 24px;background:var(--tint);border-bottom:3px dotted var(--sky)}
.pagehead .in{max-width:1092px;margin:0 auto}
.pagehead h1{font-size:32px;line-height:1.2;margin:4px 0 6px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 16px;box-shadow:var(--shadow)}
.msg .head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--tint)}
.msg .head b{font-weight:600;color:var(--heading)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--steel);color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:700;margin-right:10px;vertical-align:middle}
.msg .body{padding:16px 20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.msg .foot{padding:0 20px 14px;display:flex;flex-direction:column;gap:8px}
.att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 10px;font-size:14px;background:var(--tint)}
.att img{max-height:80px}
.orig summary{cursor:pointer;color:var(--steel);font-size:13px}
.orig pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;color:var(--muted);background:var(--tint);padding:12px;max-height:420px;overflow:auto}
.pager{display:flex;gap:8px;justify-content:center;margin:24px 0}
.btn{border:1px solid var(--steel);background:var(--surface);color:var(--navy);padding:8px 16px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-deep)}
@media (prefers-color-scheme: dark){.btn{color:var(--sky)}.btn.primary{background:var(--sky);border-color:var(--sky);color:#072a40}}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 26px}
.mo{background:var(--surface);border:1px solid var(--line);padding:9px 12px;cursor:pointer;font-size:14px;font-weight:600;color:var(--heading)}
.mo:hover{border-color:var(--steel)}
.mo.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mo span{display:block;color:var(--muted);font-size:12px;font-weight:400}
.mo.on span{color:#cfe2ee}
.signin-wrap{min-height:100vh;display:grid;place-items:center;padding:40px 16px;
  background:linear-gradient(135deg,rgba(7,65,105,.97),rgba(11,85,137,.93) 60%,rgba(93,133,162,.92)),var(--navy-deep)}
.signin{width:100%;max-width:440px}
.signin .card{padding:32px;text-align:left;border:0;border-top:4px solid var(--red);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.signin .logo{justify-content:center;margin-bottom:22px}
.signin h2{font-size:28px;margin:0 0 6px}
.signin input{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--tint);color:var(--ink);font:inherit;font-size:15px;margin:6px 0 12px}
.signin .btn{width:100%;padding:12px;margin-top:6px;font-size:15px}
.or{text-align:center;color:var(--faint);font-size:13px;margin:14px 0 8px}
.note{font-size:12.5px;color:var(--muted);margin-top:16px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.prose{max-width:760px} .prose p{margin:0 0 14px}
.prose b{color:var(--heading)}
footer{background:var(--navy-deep);color:#c7d9e5;font-size:13px}
footer .in{max-width:1140px;margin:0 auto;padding:26px 24px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer b{font-family:var(--serif);font-weight:400;font-size:17px;color:#fff}
@media (max-width:760px){
  .bar{flex-wrap:wrap;gap:14px}.bar form{order:3;flex-basis:100%;max-width:none}
  .stats{grid-template-columns:repeat(2,1fr)} .stat:nth-child(3){border-left:0} .grid2{grid-template-columns:1fr}
  .months{grid-template-columns:repeat(3,1fr)} .hero h1{font-size:28px} .hero{padding:40px 16px 34px}
  main{padding:28px 16px 56px} .util .in,.bar,.secbar .in{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="proto">PROTOTYPE for Board review · runs only on this computer · sign-in is illustrative</div>
<div class="util" id="util" hidden><div class="in"><span id="who"></span><a class="pill" href="#/about">About the archive</a><a class="pill" href="#/signout" id="signout">Sign out</a></div></div>
<header id="hdr" hidden>
  <div class="bar">
    <a class="logo" href="#/"><span class="mono" id="mono"></span><span class="wm"><span id="orgname"></span><i id="archname"></i></span></a>
    <form id="topsearch" class="search" role="search"><input name="q" placeholder="Search messages and documents…" aria-label="Search"><button>Search</button></form>
    <nav><a href="#/" data-nav="disc">Discussions</a><a href="#/ann" data-nav="ann">Announcements</a><a href="#/browse" id="navbrowse" data-nav="browse">Browse</a></nav>
  </div>
</header>
<div class="secbar" id="secbar" hidden><div class="in"><b>Past Announcements</b><span id="secbartext"></span><a href="#/">Go to the discussion archive</a></div></div>
<main id="app"></main>
<footer id="foot" hidden><div class="in"><span><b id="footorg"></b> · <span id="footsub"></span></span><span id="footnote"></span></div></footer>

<script>
// ======================================================================
// SETTINGS: edit this block for your division. Nothing else needs changing.
// ======================================================================
const CONFIG = {
  orgName: "Your Division Name",                 // header and footer
  orgShort: "D",                                 // 1-3 letters shown in the square logo
  orgSubtitle: "Division of the American Psychological Association",
  archiveName: "Member Listserv Archive",
  listDescription: "the division discussion list",       // "...messages from the division discussion list"
  annDescription: "the division announcement list",
  heroTitle: "Years of conversation among our members, searchable.",
  annHeroTitle: "Every division announcement, in one place.",
  firstYear: 2019, lastYear: 2026,                // range offered in the search filters
  coverage: "Messages from January 2019 to November 2026.",
  annCoverage: "Announcements from January 2019 to November 2026.",
  signInButton: "Sign in with your member account",
  topics: ["ethics", "mentoring", "convention", "research", "teaching", "licensure", "early career", "awards"],
  annTopics: ["workshop", "webinar", "convention", "call for proposals", "awards", "election", "CE credits", "journal"],
  aboutHtml: `<p>This archive preserves our division's member discussion list, hosted on APA's LISTSERV until its retirement.</p>`
};
// ======================================================================

const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = p => fetch(p).then(r => r.json());
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "";
const fmtMonth = ym => new Date(ym+"-15").toLocaleDateString(undefined,{year:"numeric",month:"long"});
const fmtSize = b => b > 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
const initials = n => (n||"?").replace(/[^A-Za-z ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?";
const snippet = s => esc(s).replace(/\x01/g,"<mark>").replace(/\x02/g,"</mark>");
// Two separate archives, never mixed: each section has its own API and files.
const SECTIONS = {
  disc: {key:"disc", api:"/api", files:"/files", hash:"#", one:"message", many:"messages",
         thread:"discussion", threads:"discussions", Threads:"Discussions",
         placeholder:"Search messages and documents…"},
  ann:  {key:"ann", api:"/api/ann", files:"/ann/files", hash:"#/ann", one:"announcement", many:"announcements",
         thread:"announcement", threads:"announcements", Threads:"Announcements",
         placeholder:"Search past announcements…"}
};
let S = SECTIONS.disc;
const docIcon = t => t.includes("pdf") ? "📄" : t.includes("presentation") ? "📊" : t.startsWith("image/") ? "🖼️" : "📝";

function richText(text, terms){
  // linkify URLs and highlight search terms without breaking either
  const urlRe = /\bhttps?:\/\/[^\s<>"')\]]+/g;
  const termRe = terms && terms.length ? new RegExp("(" + terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")", "gi") : null;
  const hl = s => termRe ? esc(s).replace(termRe, m => "<mark>"+m+"</mark>") : esc(s);
  let out = "", last = 0;
  for (const m of text.matchAll(urlRe)) {
    out += hl(text.slice(last, m.index));
    const u = m[0].replace(/[.,;:!?*]+$/,"");
    out += `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>` + esc(m[0].slice(u.length));
    last = m.index + m[0].length;
  }
  return out + hl(text.slice(last));
}

function threadCard(t, extra=""){
  const people = t.participants.join(", ") + (t.participant_count > t.participants.length ? ` +${t.participant_count - t.participants.length}` : "");
  const span = fmtDate(t.first) + (t.count > 1 && t.last.slice(0,10) !== t.first.slice(0,10) ? " – " + fmtDate(t.last) : "");
  const count = S.key === "ann"
    ? (t.count > 1 ? `<span>${t.count} messages</span>` : "")
    : `<span>${t.count} message${t.count>1?"s":""}</span>`;
  const who = S.key === "ann" ? `From ${people}` : people;
  return `<div class="card tcard"><h3><a href="${S.hash}/thread/${t.thread_key}${extra}">${esc(t.subject)}</a></h3>
    <div class="meta"><span>${span}</span>${count}<span>${esc(who)}</span></div></div>`;
}

// ---------------------------------------------------------------- views
function viewSignin(){
  $("#hdr").hidden = $("#foot").hidden = $("#util").hidden = true;
  app.style.cssText = "max-width:none;padding:0";
  app.innerHTML = `<div class="signin-wrap"><div class="signin">
    <div class="card">
      <div class="logo">${$(".logo").innerHTML}</div>
      <h2>Member sign-in</h2>
      <p class="meta" style="display:block;margin:0 0 14px">The archive of ${esc(CONFIG.listDescription)} is available to current members.</p>
      <button class="btn primary" id="sso">${esc(CONFIG.signInButton)}</button>
      <div class="or">or</div>
      <label class="meta" for="em">Email address on your membership</label>
      <input id="em" type="email" placeholder="you@example.com" autocomplete="off">
      <button class="btn" id="link">Email me a sign-in link</button>
      <p class="note">Prototype: the sign-in method has not been decided. Both buttons simply open the archive.</p>
    </div></div></div>`;
  const go = () => { try{sessionStorage.setItem("d13demo","1")}catch(e){}; location.hash = "#/"; };
  $("#sso").onclick = go; $("#link").onclick = go;
}

async function viewAnnHome(){
  const s = await api(S.api + "/stats");
  const max = Math.max(...s.years.map(y=>y.messages));
  const themes = CONFIG.annTopics;
  app.innerHTML = `
    <section class="hero ann"><div class="in">
      <p class="kicker">Past Announcements</p>
      <h1>${esc(CONFIG.annHeroTitle)}</h1>
      <p>Search ${s.messages.toLocaleString()} announcements from ${esc(CONFIG.annDescription)}, ${new Date(s.first).getFullYear()}–${new Date(s.last).getFullYear()}: events, calls for proposals, awards, elections and more, with their flyers and documents.</p>
      <form class="search" id="herosearch"><input name="q" placeholder="Try an event, a program, or a year" aria-label="Search announcements" autofocus><button>Search</button></form>
      <div class="chips">${themes.map(t=>`<button class="chip" data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    </div></section>
    <div class="stats">
      <div class="stat"><b>${s.messages.toLocaleString()}</b><span>announcements</span></div>
      <div class="stat"><b>${s.years.length}</b><span>years</span></div>
      <div class="stat"><b>${s.contributors}</b><span>senders</span></div>
      <div class="stat"><b>${s.documents}</b><span>attached documents</span></div>
    </div>
    <hr class="rule">
    <h2 class="sec">Explore by Year</h2>
    <div class="card"><div class="years">${s.years.map(y=>`<div class="yr" data-y="${y.year}" title="${y.messages} announcements">
      <span class="n">${y.messages}</span><div class="b" style="height:${Math.round(100*y.messages/max)}px"></div><span>${y.year}</span></div>`).join("")}</div></div>
    <hr class="rule">
    <h2>Recent Announcements</h2><div class="list">${s.recent.map(t=>threadCard(t)).join("")}</div>`;
  $("#herosearch").onsubmit = e => { e.preventDefault(); goSearch(e.target.q.value); };
  app.querySelectorAll(".chip").forEach(c => c.onclick = () => goSearch(c.dataset.q));
  app.querySelectorAll(".yr").forEach(c => c.onclick = () => location.hash = S.hash + "/browse/" + c.dataset.y);
}

async function viewHome(){
  if (S.key === "ann") return viewAnnHome();
  const s = await api("/api/stats");
  const max = Math.max(...s.years.map(y=>y.messages));
  const themes = CONFIG.topics;
  app.innerHTML = `
    <section class="hero"><div class="in">
      <p class="kicker">Member Listserv Archive</p>
      <h1>${esc(CONFIG.heroTitle)}</h1>
      <p>Search ${s.messages.toLocaleString()} messages and ${s.documents} shared documents from ${esc(CONFIG.listDescription)}, ${new Date(s.first).getFullYear()}–${new Date(s.last).getFullYear()}.</p>
      <form class="search" id="herosearch"><input name="q" placeholder="Try a topic, a question, or a person’s name" aria-label="Search" autofocus><button>Search</button></form>
      <div class="chips">${themes.map(t=>`<button class="chip" data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    </div></section>
    <div class="stats">
      <div class="stat"><b>${s.messages.toLocaleString()}</b><span>messages</span></div>
      <div class="stat"><b>${s.threads.toLocaleString()}</b><span>discussions</span></div>
      <div class="stat"><b>${s.contributors}</b><span>members who posted</span></div>
      <div class="stat"><b>${s.documents}</b><span>shared documents</span></div>
    </div>
    <hr class="rule">
    <h2 class="sec">Explore by Year</h2>
    <div class="card"><div class="years">${s.years.map(y=>`<div class="yr" data-y="${y.year}" title="${y.messages} messages, ${y.threads} discussions">
      <span class="n">${y.messages}</span><div class="b" style="height:${Math.round(100*y.messages/max)}px"></div><span>${y.year}</span></div>`).join("")}</div></div>
    <hr class="rule">
    <div class="grid2">
      <div><h2>Recent Discussions</h2><div class="list">${s.recent.map(t=>threadCard(t)).join("")}</div></div>
      <div><h2>Most Active Discussions</h2><div class="list">${s.active.map(t=>threadCard(t)).join("")}</div></div>
    </div>`;
  $("#herosearch").onsubmit = e => { e.preventDefault(); goSearch(e.target.q.value); };
  app.querySelectorAll(".chip").forEach(c => c.onclick = () => goSearch(c.dataset.q));
  app.querySelectorAll(".yr").forEach(c => c.onclick = () => location.hash = "#/browse/" + c.dataset.y);
}

function goSearch(q, opts={}){
  if (!q.trim()) return;
  const p = new URLSearchParams({q, ...opts});
  location.hash = S.hash + "/search?" + p.toString();
}

async function viewSearch(params){
  const q = params.get("q") || "", sort = params.get("sort") || "relevance",
        from = params.get("from") || "", to = params.get("to") || "", tab = params.get("tab") || "threads",
        page = +(params.get("page") || 1);
  $("#topsearch").q.value = q;
  app.innerHTML = `<div class="empty">Searching…</div>`;
  const r = await api(S.api + "/search?" + new URLSearchParams({q, sort, from, to, page}));
  const years = Array.from({length: CONFIG.lastYear - CONFIG.firstYear + 1}, (_, i) => CONFIG.lastYear - i);
  const opt = (v, cur, label) => `<option value="${v}" ${v===cur?"selected":""}>${label}</option>`;
  const termsParam = "?q=" + encodeURIComponent(q);
  app.innerHTML = `
    <div class="pagehead"><div class="in"><p class="meta">${S.key==="ann" ? "Past announcements · search results" : "Search results"}</p><h1>“${esc(q)}”</h1></div></div>
    <div class="toolbar">
      <span>${S.key==="ann" ? r.total_threads.toLocaleString() + " matching announcements" : r.total_threads.toLocaleString() + " discussions · " + r.total_messages.toLocaleString() + " matching messages"}${r.mode==="OR" ? " (showing partial matches)" : ""}</span>
      <span style="flex:1"></span>
      <label>From <select id="from">${opt("", from, "any")}${years.map(y=>opt(String(y), from, y)).join("")}</select></label>
      <label>to <select id="to">${opt("", to, "any")}${years.map(y=>opt(String(y), to, y)).join("")}</select></label>
      <label>Sort <select id="sort">${opt("relevance",sort,"Best match")}${opt("newest",sort,"Newest")}${opt("oldest",sort,"Oldest")}</select></label>
    </div>
    <div class="tabs">
      <div class="tab ${tab==="threads"?"on":""}" data-tab="threads">${S.Threads}<span class="count">${r.total_threads}</span></div>
      <div class="tab ${tab==="docs"?"on":""}" data-tab="docs">Documents<span class="count">${r.documents.length}</span></div>
    </div>
    <div id="results" class="list"></div>`;
  const res = $("#results");
  if (tab === "docs") {
    res.innerHTML = r.documents.length ? r.documents.map(d => `
      <div class="card tcard"><h3>${docIcon(d.content_type)} <a href="${S.files}/${d.sha}">${esc(d.filename)}</a></h3>
        <div class="meta"><span>${fmtSize(d.size)}</span><span>Shared by ${esc(d.from_name)}, ${fmtDate(d.date)}</span>
        <span>in <a href="${S.hash}/thread/${d.thread_key}${termsParam}">${esc(d.subject)}</a></span></div>
        <p class="snip">${snippet(d.snippet)}</p></div>`).join("")
      : `<div class="empty">No documents match.</div>`;
  } else {
    res.innerHTML = r.threads.length ? r.threads.map(t => threadCard(t, termsParam).replace("</div></div>",
      `</div><p class="snip"><span class="who">${esc(t.snippet_from)}:</span> ${snippet(t.snippet)}</p>
       ${t.hits>1?`<div class="meta" style="margin-top:6px">${t.hits} matching messages in this ${S.thread}</div>`:""}</div>`)).join("")
      : `<div class="empty">No ${S.threads} match “${esc(q)}”.</div>`;
    if (r.pages > 1) res.insertAdjacentHTML("beforeend", `<div class="pager">
      ${page>1?`<button class="btn" data-p="${page-1}">← Previous</button>`:""}
      <span class="meta" style="align-self:center">Page ${page} of ${r.pages}</span>
      ${page<r.pages?`<button class="btn" data-p="${page+1}">Next →</button>`:""}</div>`);
  }
  const upd = (k, v) => { params.set(k, v); if (k !== "page") params.delete("page"); location.hash = S.hash + "/search?" + params.toString(); };
  ["from","to","sort"].forEach(id => $("#"+id).onchange = e => upd(id, e.target.value));
  app.querySelectorAll(".tab").forEach(t => t.onclick = () => upd("tab", t.dataset.tab));
  app.querySelectorAll(".pager .btn").forEach(b => b.onclick = () => { upd("page", b.dataset.p); scrollTo(0,0); });
}

async function viewThread(key, params){
  const q = params.get("q") || "";
  const terms = q ? (q.match(/"[^"]+"|[\w'’-]{3,}/g) || []).map(t=>t.replace(/"/g,"")) : [];
  app.innerHTML = `<div class="empty">Loading…</div>`;
  const t = await api(S.api + "/thread/" + key);
  if (t.error) { app.innerHTML = `<div class="empty">${S.key==="ann" ? "Announcement" : "Discussion"} not found.</div>`; return; }
  const img = a => /^image\/(png|jpe?g|gif)$/.test(a.content_type);
  app.innerHTML = `
    <div class="pagehead"><div class="in">
    ${q ? `<p class="meta"><a href="${S.hash}/search?q=${encodeURIComponent(q)}">← Back to results for “${esc(q)}”</a></p>` : `<p class="meta"><a href="${S.hash}/">← ${S.key==="ann" ? "Past announcements" : "Archive home"}</a></p>`}
    <h1>${esc(t.subject)}</h1>
    <div class="meta">${S.key==="ann" && t.count===1 ? `<span>Announcement</span><span>${fmtDate(t.first)}</span>` : `<span>${t.count} message${t.count>1?"s":""}</span><span>${fmtDate(t.first)}${t.count>1?" – "+fmtDate(t.last):""}</span><span>${t.participant_count} participant${t.participant_count>1?"s":""}</span>`}</div>
    </div></div>
    ${t.messages.map(m => `
      <article class="msg" id="${m.msg_key}">
        <div class="head"><div><span class="avatar">${esc(initials(m.from_name))}</span><b>${esc(m.from_name)}</b></div>
          <div class="meta">${new Date(m.date_utc).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"})}</div></div>
        <div class="body">${richText(m.body || "(no text)", terms)}</div>
        <div class="foot">
          ${S.key==="ann" && m.attachments.some(img) ? `<div class="flyers">${m.attachments.filter(img).map(a =>
            `<a href="${S.files}/${a.sha}?view=1" target="_blank" title="Open full size"><img src="${S.files}/${a.sha}?view=1" alt="${esc(a.filename)}" loading="lazy"></a>`).join("")}</div>` : ""}
          ${m.attachments.filter(a => !(S.key==="ann" && img(a))).length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">${m.attachments.filter(a => !(S.key==="ann" && img(a))).map(a =>
            img(a)
              ? `<a class="att" href="${S.files}/${a.sha}?view=1" target="_blank"><img src="${S.files}/${a.sha}?view=1" alt="${esc(a.filename)}"></a>`
              : `<a class="att" href="${S.files}/${a.sha}">${docIcon(a.content_type)} ${esc(a.filename)} <span class="meta">${fmtSize(a.size)}</span></a>`).join("")}</div>` : ""}
          <details class="orig"><summary>Show original message (including quoted replies)</summary><pre>${esc(m.original)}</pre></details>
        </div>
      </article>`).join("")}`;
  const firstHit = terms.length && app.querySelector(".body mark");
  if (firstHit) firstHit.closest("article").scrollIntoView({behavior:"smooth", block:"start"});
}

async function viewBrowse(year, month){
  if (!year) {
    const s = await api(S.api + "/stats");
    const ann = S.key === "ann";
    app.innerHTML = `<div class="pagehead"><div class="in">${ann ? `<p class="meta">Past announcements</p>` : ""}<h1>Browse by Year</h1><p class="meta">${ann ? "Every announcement, by the month it was sent." : "Every discussion on the list, by the month it started."}</p></div></div><div class="list">${[...s.years].reverse().map(y => `
      <div class="card tcard"><h3><a href="${S.hash}/browse/${y.year}">${y.year}</a></h3><div class="meta">${ann ? `<span>${y.threads} announcements</span>` : `<span>${y.messages} messages</span><span>${y.threads} discussions</span>`}</div></div>`).join("")}</div>`;
    return;
  }
  const b = await api(S.api + "/browse?" + new URLSearchParams({year, month: month ? `${year}-${month}` : ""}));
  const ann = S.key === "ann";
  app.innerHTML = `<div class="pagehead"><div class="in"><p class="meta"><a href="${S.hash}/browse">← All years</a></p><h1>${year}${ann ? " announcements" : ""}</h1></div></div>
    <div class="months">${b.months.map(m => `<div class="mo ${m.month===b.month?"on":""}" data-m="${m.month.slice(5)}">${fmtMonth(m.month).split(" ")[0]}<span>${ann ? m.threads + " sent" : m.messages + " messages"}</span></div>`).join("")}</div>
    <div class="list">${b.month ? `<h2>${ann ? "Announcements sent" : "Discussions started"} in ${fmtMonth(b.month)}</h2>` + (b.threads.map(t=>threadCard(t)).join("") || `<div class="empty">None.</div>`) : `<div class="empty">Choose a month.</div>`}</div>`;
  app.querySelectorAll(".mo").forEach(m => m.onclick = () => location.hash = `${S.hash}/browse/${year}/${m.dataset.m}`);
}

function viewAbout(){
  app.innerHTML = `<div class="pagehead"><div class="in"><h1>About This Archive</h1></div></div><div class="prose">
    ${CONFIG.aboutHtml}
    <p><b>What you’ll see.</b> Each message is shown with quoted replies, list footers and most email signatures removed, so discussions read cleanly. The original text of every message is available under “Show original message”.</p>
    <p><b>Privacy.</b> Email addresses and phone numbers are hidden. The archive is available to members only. Members may ask for their posts to be removed.</p>
    <p><b>Documents.</b> Files shared on the list (PDFs, Word documents, slides) can be searched by their contents and downloaded.</p>
    <p><b>Past announcements.</b> If your archive includes them, official announcements have their own section, kept separate from the discussion archive. Each section has its own search. Flyers are shown at a size suited to the screen.</p>
    <p class="note">Prototype for Board review. Wording, policies and sign-in method to be decided.</p></div>`;
}

// ---------------------------------------------------------------- router
async function route(){
  let signed = false; try { signed = sessionStorage.getItem("d13demo") === "1"; } catch(e) {}
  const h = location.hash.slice(1) || "/";
  if (!signed && h !== "/signin") { location.hash = "#/signin"; return; }
  if (h === "/signout") { try{sessionStorage.removeItem("d13demo")}catch(e){}; location.hash = "#/signin"; return; }
  if (h === "/signin") return viewSignin();
  app.style.cssText = "";
  $("#hdr").hidden = $("#foot").hidden = $("#util").hidden = false;
  $("#who").textContent = "Signed in as a member (demo)";
  const [path, qs] = h.split("?");
  const params = new URLSearchParams(qs || "");
  let parts = path.split("/").filter(Boolean);
  S = parts[0] === "ann" ? SECTIONS.ann : SECTIONS.disc;
  if (S.key === "ann") parts = parts.slice(1);
  $("#secbar").hidden = S.key !== "ann";
  $("#navbrowse").href = S.hash + "/browse";
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on",
    a.dataset.nav === "browse" ? parts[0] === "browse" : a.dataset.nav === S.key && parts[0] !== "browse"));
  $("#topsearch").q.placeholder = S.placeholder;
  $("#footnote").textContent = "Members only. Email addresses and phone numbers are hidden. " + (S.key === "ann" ? CONFIG.annCoverage : CONFIG.coverage);
  document.title = (S.key === "ann" ? "Past Announcements · " : "") + CONFIG.orgName + " " + CONFIG.archiveName;
  if (parts[0] !== "search") $("#topsearch").q.value = "";
  try {
    if (!parts.length) await viewHome();
    else if (parts[0] === "search") await viewSearch(params);
    else if (parts[0] === "thread") await viewThread(parts[1], params);
    else if (parts[0] === "browse") await viewBrowse(parts[1], parts[2]);
    else if (parts[0] === "about") viewAbout();
    else await viewHome();
  } catch (e) { app.innerHTML = `<div class="empty">Something went wrong: ${esc(e.message)}</div>`; }
  if (!parts.length || parts[0] !== "thread") scrollTo(0, 0);
}
// fill in the settings, and hide the Announcements tab if no announcements archive is loaded
$("#mono").textContent = CONFIG.orgShort; $("#orgname").textContent = CONFIG.orgName;
$("#archname").textContent = CONFIG.archiveName; $("#footorg").textContent = CONFIG.orgName;
$("#footsub").textContent = CONFIG.orgSubtitle;
$("#secbartext").textContent = "Official announcements from " + CONFIG.annDescription + ". Searches here cover announcements only.";
fetch("/api/ann/stats").then(r => { if (!r.ok) $("[data-nav=ann]").hidden = true; }).catch(() => {});
$("#topsearch").onsubmit = e => { e.preventDefault(); goSearch(e.target.q.value); };
addEventListener("hashchange", route);
route();
</script>
